<!DOCTYPE html>

<head>

  <title>Contact | EyeLabs AI</title>
  <link rel="shortcut icon" type="image/x-icon" href="img/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

<!-- Nav -->
<nav>
  <a href="index.html" class="nav-logo">
    <img src="images/eyelabs-logo-white.png" alt="EyeLabs AI">
  </a>
  <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links">
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html" class="nav-cta active">Contact</a></li>

<!-- Page Header -->
<header class="page-header">
  <h1>Get in touch</h1>
  <p>Have a question or want to explore how AI can work for your practice? Drop us a note.</p>
</header>

<!-- Contact -->
<section class="contact">
  <div class="contact-inner">
    <form class="contact-form" action="https://formspree.io/f/xrgwqkjn" method="POST">
      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="organization" placeholder="Organization (optional)">
      <textarea name="message" placeholder="Tell us about your needs..." required></textarea>
      <button type="submit">Send Message</button>
    </form>
    <div class="contact-info">
      <a href="mailto:gurpalv@eyelabs.ai">gurpalv@eyelabs.ai</a>
      <div class="social-links">
        <a href="https://www.linkedin.com/in/gurpalvirdi/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://twitter.com/EyeLabs_AI" target="_blank" rel="noopener">X / Twitter</a>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <div class="footer-left">
    <p>EyeLabs AI &copy; 2026. All rights reserved.</p>
  </div>
  <div class="footer-links">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</footer>
